# Intention de la fabric, chargée une fois dans NetBox par seed_netbox.py.
# Ensuite, NetBox est l'unique source de vérité : render.py ne lit que NetBox.
site: dc1
devices:
  spine1: { role: spine, asn: 65000, loopback: 10.0.0.1/32 }
  spine2: { role: spine, asn: 65000, loopback: 10.0.0.2/32 }
  leaf1:  { role: leaf,  asn: 65011, loopback: 10.0.0.11/32, vnis: [{ vni: 100, access: eth3 }] }
  leaf2:  { role: leaf,  asn: 65012, loopback: 10.0.0.12/32, vnis: [{ vni: 100, access: eth3 }] }
  host1:  { role: server, ip: 10.10.100.11/24 }
  host2:  { role: server, ip: 10.10.100.12/24 }
links:  # [a_device, a_if, a_ip, b_device, b_if, b_ip]
  - [spine1, eth1, 10.1.1.0/31, leaf1, eth1, 10.1.1.1/31]
  - [spine1, eth2, 10.1.1.2/31, leaf2, eth1, 10.1.1.3/31]
  - [spine2, eth1, 10.1.2.0/31, leaf1, eth2, 10.1.2.1/31]
  - [spine2, eth2, 10.1.2.2/31, leaf2, eth2, 10.1.2.3/31]
  - [leaf1, eth3, null, host1, eth1, null]
  - [leaf2, eth3, null, host2, eth1, null]
